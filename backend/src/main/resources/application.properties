spring.application.name=seo
# SEO 설정
seo.site-url=https://www.veritasvan.org
seo.robots.allow-indexing=true
# 정적 리소스 캐시 (초 단위)
seo.cache.static-max-age=31536000
seo.cache.html-max-age=0
# 301 리다이렉트 매핑 (옛경로:새경로, 쉼표로 구분)
seo.redirects=/old-news:/news,/company:/about,/inquiry:/contact
spring.mvc.throw-exception-if-no-handler-found=true
# H2 데이터베이스 (파일 모드)
spring.datasource.url=jdbc:h2:file:./data/seodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 조직 정보 (JSON-LD)
seo.org.name=VAN
seo.org.description=\uC11C\uC6B8\uB300\uD559\uAD50\u00B7\uC5F0\uC138\uB300\uD559\uAD50\u00B7\uACE0\uB824\uB300\uD559\uAD50\uC758 \uD559\uD68C \uC5F0\uB300\uC5D0\uC11C \uCD9C\uBC1C\uD574 \uC804\uAD6D \uB300\uD559\uC744 \uC544\uC6B0\uB974\uB294 \uD55C\uAD6D\uB300\uD559 \uD559\uD68C\u00B7\uD559\uC220 \uCD1D\uC5F0\uD569\uCCB4\uC785\uB2C8\uB2E4.
seo.org.logo-path=/assets/logo_dark.png
# CORS 허용 출처 (프론트엔드 연동)
seo.cors.allowed-origins=http://localhost:*,https://*.vercel.app,https://veritasvan.org,https://www.veritasvan.org,https://vanconf.com,https://www.vanconf.com
