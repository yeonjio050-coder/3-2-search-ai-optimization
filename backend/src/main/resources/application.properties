spring.application.name=seo
# SEO 설정
seo.site-url=https://www.veritasvan.org
seo.robots.allow-indexing=true
# 정적 리소스 캐시 (초 단위)
seo.cache.static-max-age=31536000
seo.cache.html-max-age=0
# 301 리다이렉트 매핑 (옛경로:새경로, 쉼표로 구분)
seo.redirects=/old-news:/news,/company:/about,/inquiry:/contact
spring.mvc.throw-exception-if-no-handler-found=true
# H2 데이터베이스 (파일 모드)
spring.datasource.url=jdbc:h2:file:./data/seodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 조직 정보 (JSON-LD)
seo.org.name=VAN
seo.org.description=VAN (Veritas Academiae Nexus) is a national alliance of university academic societies in Korea, originating from the coalition of societies at Seoul National University, Yonsei University, and Korea University.
seo.org.logo-path=/assets/logo_dark.png
# CORS 허용 출처 (프론트엔드 연동)
seo.cors.allowed-origins=http://localhost:*,https://*.vercel.app,https://veritasvan.org,https://www.veritasvan.org,https://vanconf.com,https://www.vanconf.com
